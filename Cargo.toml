[package]
name = "tree-space"
version = "0.2.0"
edition = "2024"
# edition 2024 requires Rust 1.85; slice::as_chunks (src/preview.rs) needs 1.88.
rust-version = "1.88"
description = "A dockable, keyboard-first file manager panel for Wayland/Hyprland"
license = "MIT"
authors = ["Eolu"]
repository = "https://github.com/Eolu/tree-space/"
homepage = "https://github.com/Eolu/tree-space/"
readme = "README.md"
keywords = ["file-manager", "wayland", "hyprland", "gtk4", "panel"]
categories = ["command-line-utilities", "filesystem", "gui"]
# The screenshots/GIFs under docs/ are for the README (crates.io rewrites those
# relative links to the GitHub repo), not needed to build: keep them out of the
# published crate so `cargo install` does not download ~800 KiB of images.
exclude = ["docs/"]

# Two names for one entry point. `ts` is the short interactive name; packaging
# installs `tree-space` because /usr/bin/ts belongs to moreutils on Arch.
# Auto-discovery is disabled so the two targets are declared explicitly.
autobins = false

[[bin]]
name = "ts"
path = "src/main.rs"

[[bin]]
name = "tree-space"
path = "src/bin/tree-space.rs"

[dependencies]
# Elm-style GTK4 framework. Re-exports gtk/gdk/gio/glib as relm4::gtk::*
relm4 = "0.11"
# GTK4 bindings pinned to the same minor as relm4; feature enables FileDialog /
# AlertDialog / CssProvider::load_from_string (GTK >= 4.12).
gtk4 = { version = "0.11", features = ["v4_12"] }
# wlr-layer-shell protocol bindings; v1_3 matches the system library (>= 1.3).
gtk4-layer-shell = { version = "0.8.1", features = ["v1_3"] }
# inotify-backed file watching (RecommendedWatcher on Linux).
notify = "8"
serde = { version = "1", features = ["derive"] }
toml = "1"
regex = "1"
# Inline audio playback. Optional: disabling the `audio` feature drops this
# binding dependency entirely (GTK still links libgstreamer itself), at the cost
# of no inline audio player. See the `audio` feature below.
gstreamer = { version = "0.25.4", optional = true }
# Inline document previews (see `preview.rs`): parse data formats and read
# archive tables. All pure-Rust, no system libraries at runtime.
serde_json = "1"
serde_norway = "0.9"
tar = "0.4"
flate2 = "1"
# Only the zip reader is used (listing), but entries are commonly Deflate-
# compressed, so enable that one backend and skip crypto/7z/zstd/etc.
zip = { version = "8", default-features = false, features = ["deflate"] }

[features]
# `audio` is on by default; build with `--no-default-features` to drop the
# `gstreamer` dependency (audio files then have no inline player).
default = ["audio"]
audio = ["dep:gstreamer"]

[dev-dependencies]
tempfile = "3"

[profile.dev]
# GTK dependency tree is large; optimize deps even in dev builds.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true