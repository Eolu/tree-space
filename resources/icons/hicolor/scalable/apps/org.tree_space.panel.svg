<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Tree Space</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c3d"/>
      <stop offset="1" stop-color="#191a24"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb0ff"/>
      <stop offset="1" stop-color="#5c7cfa"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="27" fill="url(#bg)"/>

  <!-- the docked panel -->
  <rect x="20" y="26" width="28" height="76" rx="7" fill="url(#panel)"/>
  <g fill="#191a24" opacity="0.55">
    <rect x="26" y="35" width="16" height="4.5" rx="2.25"/>
    <rect x="26" y="46" width="11" height="4.5" rx="2.25"/>
    <rect x="26" y="57" width="14" height="4.5" rx="2.25"/>
    <rect x="26" y="68" width="9" height="4.5" rx="2.25"/>
  </g>

  <!-- file tree -->
  <g fill="#8fb0ff">
    <rect x="66" y="33" width="13" height="13" rx="3"/>
    <rect x="80" y="59" width="13" height="13" rx="3"/>
    <rect x="80" y="85" width="13" height="13" rx="3"/>
  </g>
  <g stroke="#8fb0ff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M72.5 46 V65.5 H80"/>
    <path d="M72.5 65.5 V91.5 H80"/>
  </g>
  <g fill="#c9d6ff">
    <rect x="99" y="36.5" width="10" height="6" rx="3"/>
    <rect x="99" y="62.5" width="14" height="6" rx="3"/>
    <rect x="99" y="88.5" width="8" height="6" rx="3"/>
  </g>
</svg>
